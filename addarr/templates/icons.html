{% macro icon(name, class='') -%}
<svg class="icon {{ class }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'dashboard' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'requests' %}<path d="M4 4h16v16H4zM4 15h4l2 3h4l2-3h4M8 8h8M8 11h5"/>
{% elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M21 20v-2a6 6 0 0 0-4-5.65"/>
{% elif name == 'services' %}<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M15 6.5h2M15 17.5h2"/>
{% elif name == 'settings' %}<path d="M4 7h5m4 0h7M4 17h9m4 0h3"/><circle cx="11" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>
{% elif name == 'migration' %}<path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/>
{% elif name == 'diagnostics' %}<path d="M2 12h5l3-8 4 16 3-8h5"/>
{% elif name == 'movie' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/>
{% elif name == 'series' %}<rect x="3" y="6" width="18" height="14" rx="3"/><path d="m8 2 4 4 4-4m-6 8h4"/>
{% elif name == 'music' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M7 12a5 5 0 0 1 5-5m5 5a5 5 0 0 1-5 5"/>
{% elif name == 'telegram' %}<path d="m21 3-5 18-6-7-7-4 18-7ZM10 14l11-11M10 14v5l3-2"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'external' %}<path d="M6 18 18 6M6 6h12v12"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>
{% elif name == 'globe' %}<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>
{% elif name == 'logout' %}<path d="M9 4H4v16h5m5-13 5 5-5 5M9 12h10"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'eye' %}<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
{% elif name == 'play' %}<path d="m9 5 11 7-11 7V5Z"/>
{% endif %}
</svg>
{%- endmacro %}

{% macro brand() -%}
<a class="brand" href="/" aria-label="Addarr"><img class="brand-mark" src="/static/logos/addarr.svg" width="40" height="40" alt=""><span>Addarr</span></a>
{%- endmacro %}

{% macro app_logo(name) -%}
<img class="app-logo" src="/static/logos/{{ name }}.{{ 'svg' if name == 'telegram' else 'png' }}" width="40" height="40" alt="">
{%- endmacro %}
