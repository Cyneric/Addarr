name: Verify
on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen --group dev
      - run: uv run ruff check addarr tests
      - run: uv run mypy addarr
      - run: uv run pytest -q
      - if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: uv run python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: browser-preview
          path: artifacts/
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: addarr:test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/container_smoke.py addarr:test
