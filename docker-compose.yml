services:
  addarr:
    # Before the first published release: docker compose build
    image: ghcr.io/cyneric/addarr:${ADDARR_VERSION:-2.0.0a1}
    build: .
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${ADDARR_BIND:-127.0.0.1}:${ADDARR_PORT:-8090}:8090"
    volumes:
      - ${ADDARR_CONFIG:-./config}:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
